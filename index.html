<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>馥味香 點餐系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #f25c05;       /* 馥郁焦糖橘 */
  --primary-hover: #d44d00;
  --primary-light: #fef2ee;
  --accent: #f5a623;        /* 金酥黃 */
  --dark: #2d221c;          /* 炭焙黑 */
  --dark-light: #4a3e36;
  --dark-muted: #8a7c73;
  --bg-warm: #fbf9f6;       /* 溫潤奶油白 */
  --bg-white: #ffffff;
  --border-color: #ede8e2;
  --success: #27ae60;
  --success-light: #edf9f2;
  --shadow-sm: 0 4px 12px rgba(45,34,28,0.03);
  --shadow-md: 0 8px 30px rgba(45,34,28,0.06);
  --shadow-lg: 0 16px 40px rgba(45,34,28,0.12);
  --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 24px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: 'Noto Sans TC', 'Outfit', sans-serif;
  background: var(--bg-warm);
  color: var(--dark);
  max-width: 800px;
  margin: 0 auto;
  min-height: 100vh;
  position: relative;
  box-shadow: 0 0 40px rgba(45,34,28,0.05);
  background-color: var(--bg-white);
  overflow-x: hidden;
}

html {
  background: var(--bg-warm);
  scroll-behavior: smooth;
}

/* ── Custom Scrollbar ── */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: #e0dbd5;
  border-radius: 99px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--dark-muted);
}

/* ── Header Banner ── */
.header {
  background: linear-gradient(135deg, #1b1512 0%, #3e2e26 100%);
  padding: 32px 20px 28px;
  text-align: center;
  position: relative;
  color: var(--bg-warm);
  border-bottom: 3px solid var(--primary);
  overflow: hidden;
}
.header::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -20%;
  width: 140%;
  height: 140%;
  background: radial-gradient(circle, rgba(242,92,5,0.12) 0%, transparent 70%);
  z-index: 1;
  pointer-events: none;
}
.header-name {
  font-size: 28px;
  font-weight: 900;
  letter-spacing: 2px;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  position: relative;
  z-index: 2;
  text-shadow: 0 2px 4px rgba(0,0,0,0.3);
}
.header-name span {
  color: var(--accent);
}
.header-sub {
  font-size: 13px;
  color: #c9bcaf;
  margin-top: 8px;
  letter-spacing: 0.5px;
  font-weight: 500;
  position: relative;
  z-index: 2;
}

/* Language Toggle */
.lang-toggle {
  position: absolute;
  top: 16px;
  right: 16px;
  display: flex;
  align-items: center;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 99px;
  padding: 3px;
  gap: 2px;
  cursor: pointer;
  z-index: 10;
  backdrop-filter: blur(10px);
}
.lang-btn {
  padding: 4px 10px;
  font-size: 11px;
  font-weight: 700;
  border-radius: 99px;
  border: none;
  background: transparent;
  color: #c9bcaf;
  cursor: pointer;
  font-family: inherit;
  transition: var(--transition);
  white-space: nowrap;
}
.lang-btn.active {
  background: var(--primary);
  color: #fff;
  box-shadow: 0 2px 8px rgba(242,92,5,0.3);
}

/* ── Interactive Toolbar ── */
.toolbar {
  padding: 16px 16px 8px;
  background: var(--bg-white);
  display: flex;
  gap: 10px;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 30;
  border-bottom: 1px solid var(--border-color);
  backdrop-filter: blur(10px);
  background-color: rgba(255, 255, 255, 0.95);
}
.search-wrap {
  position: relative;
  flex: 1;
}
.search-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--dark-muted);
  pointer-events: none;
  display: flex;
  align-items: center;
}
.search-input {
  width: 100%;
  padding: 12px 16px 12px 42px;
  border: 1.5px solid var(--border-color);
  border-radius: var(--radius-md);
  font-size: 14px;
  font-weight: 500;
  font-family: inherit;
  color: var(--dark);
  background: var(--bg-warm);
  transition: var(--transition);
}
.search-input:focus {
  outline: none;
  border-color: var(--primary);
  background: var(--bg-white);
  box-shadow: 0 0 0 3px rgba(242,92,5,0.15);
}
.history-trigger-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 11px 16px;
  border-radius: var(--radius-md);
  border: 1.5px solid var(--border-color);
  background: var(--bg-white);
  color: var(--dark-light);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: var(--transition);
  font-family: inherit;
  white-space: nowrap;
}
.history-trigger-btn:hover {
  background: var(--primary-light);
  border-color: var(--primary);
  color: var(--primary);
}
.history-trigger-btn svg {
  transition: transform var(--transition);
}
.history-trigger-btn:hover svg {
  transform: rotate(-15deg);
}

/* ── Category Nav ── */
.cat-nav {
  background: var(--bg-white);
  border-bottom: 1px solid var(--border-color);
  position: sticky;
  top: 59px;
  z-index: 29;
  backdrop-filter: blur(10px);
  background-color: rgba(255, 255, 255, 0.95);
}
.cat-nav-inner {
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 0 12px;
  gap: 4px;
}
.cat-nav-inner::-webkit-scrollbar {
  display: none;
}
.cat-tab {
  flex-shrink: 0;
  padding: 14px 16px;
  font-size: 15px;
  font-weight: 700;
  color: var(--dark-muted);
  background: none;
  border: none;
  border-bottom: 3px solid transparent;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
  transition: var(--transition);
}
.cat-tab.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
}

/* ── Menu Grid ── */
.menu-body {
  padding: 8px 16px 120px;
}
.section-title {
  font-size: 14px;
  font-weight: 900;
  color: var(--dark-light);
  letter-spacing: 1.5px;
  padding: 24px 4px 12px;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border-color);
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
  gap: 16px;
}

.item-card {
  background: var(--bg-white);
  border-radius: var(--radius-md);
  overflow: hidden;
  border: 1.5px solid var(--border-color);
  cursor: pointer;
  transition: var(--transition);
  user-select: none;
  display: flex;
  flex-direction: column;
  position: relative;
  box-shadow: var(--shadow-sm);
}
.item-card.in-cart {
  border-color: var(--primary);
  box-shadow: 0 0 0 1px var(--primary), var(--shadow-md);
}
.item-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-md);
  border-color: var(--dark-muted);
}
.item-card.in-cart:hover {
  border-color: var(--primary-hover);
}
.item-card:active {
  transform: translateY(-2px) scale(0.98);
}
.item-photo-wrap {
  position: relative;
  width: 100%;
  padding-top: 75%;
  background: var(--bg-warm);
  overflow: hidden;
}
.item-photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  transition: transform 0.4s ease;
}
.item-card:hover .item-photo {
  transform: scale(1.06);
}
.item-badges {
  position: absolute;
  top: 8px;
  left: 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  z-index: 5;
}
.item-hot-badge {
  background: #e8292f;
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  padding: 3px 8px;
  border-radius: 6px;
  box-shadow: 0 2px 4px rgba(232,41,47,0.3);
}
.item-new-badge {
  background: var(--accent);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  padding: 3px 8px;
  border-radius: 6px;
  box-shadow: 0 2px 4px rgba(245,166,35,0.3);
}
.item-combo-badge {
  background: rgba(45,34,28,0.85);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  padding: 3px 8px;
  border-radius: 6px;
  backdrop-filter: blur(4px);
}
.card-qty-badge {
  position: absolute;
  top: 8px;
  right: 8px;
  background: var(--primary);
  color: #fff;
  font-size: 11px;
  font-weight: 900;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 8px rgba(242,92,5,0.4);
  z-index: 6;
  animation: popIn 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28);
}
.item-body {
  padding: 14px 12px;
  display: flex;
  flex-direction: column;
  flex-grow: 1;
}
.item-name {
  font-size: 15px;
  font-weight: 800;
  line-height: 1.4;
  color: var(--dark);
  margin-bottom: 12px;
  min-height: 42px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.item-price-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  margin-top: auto;
}
.item-price {
  font-size: 18px;
  font-weight: 900;
  color: var(--primary);
}
.item-price::before {
  content: '$';
  font-size: 13px;
  margin-right: 1px;
  font-weight: 700;
}
.item-add {
  width: 32px;
  height: 32px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
  box-shadow: 0 2px 6px rgba(242,92,5,0.25);
}
.item-add:hover {
  background: var(--primary-hover);
  transform: scale(1.1);
}
.item-add:active {
  transform: scale(0.9);
}

/* ── Floating Cart Button ── */
.float-cart-btn {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: var(--primary);
  color: #fff;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 20px rgba(242,92,5,0.4);
  z-index: 70;
  transition: var(--transition);
}
.float-cart-btn:hover {
  background: var(--primary-hover);
  transform: scale(1.08) rotate(-5deg);
  box-shadow: 0 6px 24px rgba(242,92,5,0.5);
}
.float-cart-btn:active {
  transform: scale(0.92);
}
.float-cart-badge {
  position: absolute;
  top: -2px;
  right: -2px;
  background: #e8292f;
  color: #fff;
  font-size: 11px;
  font-weight: 900;
  min-width: 22px;
  height: 22px;
  padding: 0 5px;
  border-radius: 99px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-white);
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}
.float-cart-badge.pulse {
  animation: badgePulse 0.4s ease-out;
}
@keyframes badgePulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.4); }
  100% { transform: scale(1); }
}

/* ── Slide-Out Drawer (Cart & History) ── */
.drawer-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(45,34,28,0.5);
  z-index: 100;
  backdrop-filter: blur(5px);
  animation: fadeIn 0.25s var(--transition);
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.drawer {
  position: fixed;
  background: var(--bg-white);
  z-index: 101;
  box-shadow: var(--shadow-lg);
  display: flex;
  flex-direction: column;
  transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.3, 1);
}

/* Responsive Drawer Styles */
@media (max-width: 768px) {
  .drawer-cart, .drawer-history {
    width: 100%;
    height: 88vh;
    bottom: 0;
    left: 0;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    transform: translateY(100%);
  }
}
@media (min-width: 769px) {
  .drawer-cart {
    width: 480px;
    height: 100vh;
    top: 0;
    right: 0;
    transform: translateX(100%);
  }
  .drawer-history {
    width: 480px;
    height: 100vh;
    top: 0;
    left: 0;
    transform: translateX(-100%);
  }
}

.drawer.open {
  transform: none !important;
}

.drawer-header {
  padding: 20px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.drawer-title {
  font-size: 18px;
  font-weight: 900;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--dark);
}
.drawer-close {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: var(--bg-warm);
  color: var(--dark-light);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
}
.drawer-close:hover {
  background: var(--primary-light);
  color: var(--primary);
  transform: rotate(90deg);
}

.drawer-body {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* ── Drawer Cart Specifics ── */
.drawer-cart-clear {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 700;
  color: var(--dark-muted);
  background: none;
  border: none;
  cursor: pointer;
  transition: var(--transition);
}
.drawer-cart-clear:hover {
  color: #e8292f;
}

.cart-list-container {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.cart-empty {
  padding: 48px 16px;
  text-align: center;
  color: var(--dark-muted);
  font-size: 14px;
  line-height: 1.8;
  border: 2.5px dashed var(--border-color);
  border-radius: var(--radius-md);
  background: var(--bg-warm);
}
.cart-item {
  display: flex;
  align-items: center;
  padding: 14px;
  border: 1.5px solid var(--border-color);
  border-radius: var(--radius-md);
  gap: 12px;
  background: var(--bg-white);
  position: relative;
  animation: itemFadeUp 0.3s ease;
}
@keyframes itemFadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.ci-thumb {
  width: 52px;
  height: 52px;
  border-radius: var(--radius-sm);
  object-fit: cover;
  flex-shrink: 0;
  background: var(--bg-warm);
  border: 1px solid var(--border-color);
}
.ci-info {
  flex: 1;
  min-width: 0;
}
.ci-name {
  font-size: 14px;
  font-weight: 800;
  color: var(--dark);
}
.ci-opts {
  font-size: 11px;
  color: var(--primary);
  margin-top: 4px;
  font-weight: 700;
  background: var(--primary-light);
  padding: 2px 6px;
  border-radius: 4px;
  display: inline-block;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ci-ctrl {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}
.cq-btn {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1.5px solid var(--border-color);
  background: var(--bg-white);
  color: var(--dark-light);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
}
.cq-btn:hover {
  border-color: var(--dark-muted);
  color: var(--dark);
}
.cq-btn.minus {
  border-color: #fddcd0;
  color: var(--primary);
  background: var(--primary-light);
}
.cq-btn.minus:hover {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}
.cq-btn.del {
  border-color: #fddada;
  color: #e8292f;
  background: #fdf2f2;
}
.cq-btn.del:hover {
  background: #e8292f;
  color: #fff;
  border-color: #e8292f;
}
.cq-qty {
  font-size: 14px;
  font-weight: 800;
  min-width: 18px;
  text-align: center;
}
.ci-price {
  font-size: 15px;
  font-weight: 900;
  color: var(--dark);
  min-width: 52px;
  text-align: right;
}

/* ── Takeout Preference Form ── */
.form-panel {
  border-top: 1.5px solid var(--border-color);
  padding-top: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.form-title {
  font-size: 15px;
  font-weight: 900;
  color: var(--dark-light);
  display: flex;
  align-items: center;
  gap: 6px;
}
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.form-group.full {
  grid-column: span 2;
}
.form-label {
  font-size: 12px;
  font-weight: 800;
  color: var(--dark-muted);
  letter-spacing: 0.5px;
}
.form-input {
  width: 100%;
  padding: 10px 14px;
  border: 1.5px solid var(--border-color);
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-family: inherit;
  color: var(--dark);
  background: var(--bg-warm);
  transition: var(--transition);
}
.form-input:focus {
  outline: none;
  border-color: var(--primary);
  background: var(--bg-white);
}

.chips-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.chip-btn {
  padding: 8px 14px;
  border-radius: 99px;
  border: 1.5px solid var(--border-color);
  background: var(--bg-white);
  color: var(--dark-light);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: var(--transition);
  font-family: inherit;
}
.chip-btn:hover {
  border-color: var(--dark-muted);
}
.chip-btn.active {
  border-color: var(--primary);
  background: var(--primary-light);
  color: var(--primary);
  font-weight: 800;
}

/* QR Display Container */
.qr-container {
  background: var(--bg-warm);
  border: 1.5px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 12px;
  animation: fadeIn 0.2s ease;
}
.qr-title {
  font-size: 13px;
  font-weight: 900;
  color: var(--dark-light);
}
.qr-img {
  width: 160px;
  height: 160px;
  border-radius: var(--radius-sm);
  background: #fff;
  border: 1.5px solid var(--border-color);
  object-fit: contain;
  padding: 6px;
}
.qr-tip {
  font-size: 11px;
  color: var(--dark-muted);
  line-height: 1.5;
  font-weight: 500;
}
.qr-missing-box {
  background: #fff8f5;
  border: 1px dashed var(--primary);
  border-radius: var(--radius-sm);
  padding: 12px;
  font-size: 11px;
  color: var(--primary);
  line-height: 1.5;
  font-weight: 600;
}

/* ── Drawer Footer ── */
.drawer-footer {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  background: var(--bg-white);
}
.drawer-footer-discounts {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
}
.drawer-footer-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.drawer-footer-label {
  display: flex;
  flex-direction: column;
}
.df-lbl-text {
  font-size: 12px;
  color: var(--dark-muted);

/* ── History Item ── */

/* ── Modal Design ── */
#modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(45,34,28,0.5);
  z-index: 150;
  align-items: flex-end;
  justify-content: center;
  backdrop-filter: blur(5px);
  animation: fadeIn 0.2s ease-out;
}
#modal-box {
  background: var(--bg-white);
  width: 100%;
  max-width: 500px;
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  padding-bottom: max(20px, env(safe-area-inset-bottom));
  animation: slideUp 0.3s cubic-bezier(0.2, 0.8, 0.3, 1.15);
  max-height: 88vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  display: flex;
  flex-direction: column;
}
@media(min-width: 600px){
  #modal-overlay {
    align-items: center;
  }
  #modal-box {
    border-radius: var(--radius-lg);
    animation: popIn 0.25s cubic-bezier(0.18, 0.89, 0.32, 1.15);
  }
  .modal-drag {
    display: none;
  }
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
@keyframes popIn {
  from { opacity: 0; transform: scale(0.92); }
  to { opacity: 1; transform: scale(1); }
}
.modal-drag {
  width: 36px;
  height: 4px;
  background: var(--border-color);
  border-radius: 99px;
  margin: 12px auto 0;
}
.modal-item-row {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 20px;
  border-bottom: 1.5px solid var(--border-color);
}
.modal-thumb {
  width: 68px;
  height: 68px;
  border-radius: var(--radius-sm);
  object-fit: cover;
  flex-shrink: 0;
  background: var(--bg-warm);
  border: 1px solid var(--border-color);
}
.modal-item-name {
  font-size: 20px;
  font-weight: 900;
  color: var(--dark);
}
.modal-item-price {
  font-size: 15px;
  color: var(--primary);
  font-weight: 800;
  margin-top: 4px;
}
.modal-body {
  padding: 0 20px;
  overflow-y: auto;
}
.opt-group {
  padding: 16px 0;
  border-bottom: 1.5px solid var(--border-color);
}
.opt-group:last-of-type {
  border: none;
}
.opt-label {
  font-size: 12px;
  font-weight: 800;
  color: var(--dark-muted);
  letter-spacing: 0.8px;
  margin-bottom: 12px;
}
.opt-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.opt-chip {
  padding: 8px 18px;
  border: 1.5px solid var(--border-color);
  background: var(--bg-white);
  border-radius: 99px;
  font-size: 13px;
  font-weight: 700;
  font-family: inherit;
  color: var(--dark-light);
  cursor: pointer;
  transition: var(--transition);
}
.opt-chip:hover {
  border-color: var(--dark-muted);
}
.opt-chip.active {
  border-color: var(--primary);
  background: var(--primary-light);
  color: var(--primary);
  font-weight: 800;
}
.qty-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px;
  border-top: 1.5px solid var(--border-color);
  background: var(--bg-white);
}
.qty-label {
  font-size: 15px;
  font-weight: 800;
}
.qty-ctrl {
  display: flex;
  align-items: center;
  gap: 14px;
}
.qty-btn {

  height: 38px;
  border-radius: 50%;

  background: var(--bg-white);
  color: var(--dark);

  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
}
.qty-btn:hover {
  border-color: var(--dark-muted);
}
#modal-qty {

  font-weight: 900;
  min-width: 24px;
  text-align: center;
}
.modal-footer {

}
.m-cancel {

  border-radius: var(--radius-sm);
  background: var(--bg-white);
  font-size: 15px;
  font-weight: 800;
  font-family: inherit;
  color: var(--dark-muted);
  cursor: pointer;
  transition: var(--transition);
}
.m-cancel:hover {
  background: var(--bg-warm);
  color: var(--dark);
}
.m-confirm {
  flex: 1;
  padding: 12px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-weight: 800;
  font-family: inherit;
  cursor: pointer;
  transition: var(--transition);
  box-shadow: 0 4px 12px rgba(242,92,5,0.25);
}
.m-confirm:hover {
  background: var(--primary-hover);
}

/* ── LINE Guide Modal ── */
#guide-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(45,34,28,0.6);
  z-index: 200;
  align-items: center;
  justify-content: center;

}
#guide-box {

  max-width: 440px;
  border-radius: var(--radius-lg);
  padding: 28px;
  box-shadow: var(--shadow-lg);

  flex-direction: column;

}
.guide-title {

  font-weight: 900;
  color: var(--success);
  display: flex;
  align-items: center;
  gap: 8px;
  justify-content: center;
}
.guide-steps {
  display: flex;
  flex-direction: column;
  gap: 16px;
  background: var(--bg-warm);
  border: 1.5px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 20px;
}
.guide-step {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  font-size: 14px;
  font-weight: 700;
  color: var(--dark-light);
  line-height: 1.5;
}
.guide-step-num {
  background: var(--primary-light);
  color: var(--primary);
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 900;
  flex-shrink: 0;
}
.guide-step.done .guide-step-num {
  background: var(--success-light);
  color: var(--success);
}
.guide-btn {
  background: #06c755; /* LINE Green */
  color: #fff;
  border: none;
  border-radius: var(--radius-md);
  padding: 14px;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  font-family: inherit;
  transition: var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 4px 12px rgba(6,199,85,0.3);
}
.guide-btn:hover {
  background: #05b04b;
  box-shadow: 0 6px 16px rgba(6,199,85,0.4);
}
.guide-close {
  background: none;
  border: none;
  color: var(--dark-muted);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
  transition: var(--transition);
}
.guide-close:hover {
  color: var(--dark);
}

/* ── Toast ── */
#toast {
  position: fixed;
  bottom: 96px;
  left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: rgba(45,34,28,0.95);
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  padding: 12px 24px;
  border-radius: var(--radius-sm);
  white-space: nowrap;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.2s, transform 0.2s;
  z-index: 210;
  box-shadow: var(--shadow-md);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.1);
}
#toast.show {
  opacity: 1;
  visibility: visible;
  transform: translateX(-50%) translateY(0);
}
</style>
</head>

<!-- ══ Header ══ -->

  document.getElementById('lbl-guide-btn').textContent = T.guideSubmit;
  document.querySelector('.guide-close').textContent = T.guideClose;

  // Rebuild pickup time chips
  const timeChips = document.getElementById('pickup-chips');
  if (timeChips) {
    const activeTimeVal = currentPickupTime;
    timeChips.innerHTML = `
      <button class="chip-btn ${activeTimeVal==='15'?'active':''}" data-val="15" onclick="setPickupTime('15')">${T.pickupMin(15)}</button>
      <button class="chip-btn ${activeTimeVal==='30'?'active':''}" data-val="30" onclick="setPickupTime('30')">${T.pickupMin(30)}</button>

  // Update dynamic translations inside drawers, popups
  document.getElementById('history-title-txt').textContent = T.historyTitle;

  // Rebuild tabs & menu grid
  document.getElementById('cat-tabs').innerHTML = '';

}

function initTabs() {
  const nav = document.getElementById('cat-tabs');
  if (!nav) return;
  nav.innerHTML = '';
  CATS.forEach((cat, i) => {
    const btn = document.createElement('button');
    btn.className = 'cat-tab' + (i === 0 ? ' active' : '');
    btn.textContent = t().cats[cat] || cat;
    btn.onclick = () => {
      document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const element = document.getElementById('sec-'+cat);
      if (element) {
        const yOffset = -107; 
        const y = element.getBoundingClientRect().top + window.pageYOffset + yOffset;
        window.scrollTo({ top: y, behavior: 'smooth' });
      }
    };
    nav.appendChild(btn);
  });
}

/* ══════════════════════════════════════
   Fuzzy Search & Filters
══════════════════════════════════════ */
function handleSearch() {
  const searchEl = document.getElementById('search-bar');
  if (!searchEl) return;
  const query = searchEl.value.toLowerCase().trim();
  
  menu.forEach(item => {
    const card = document.getElementById('menu-card-' + item.id);
    if (!card) return;

    const nameZh = item.name.toLowerCase();
    const nameEn = (item.nameEn || '').toLowerCase();
    const catZh = item.category.toLowerCase();
    const catEn = (t().cats[item.category] || '').toLowerCase();

    const matches = nameZh.includes(query) || nameEn.includes(query) || catZh.includes(query) || catEn.includes(query);
    card.style.display = matches ? 'flex' : 'none';
  });

  // Hide empty category headers
  CATS.forEach(cat => {
    const sec = document.getElementById('sec-' + cat);
    if (!sec) return;
    const grid = sec.querySelector('.grid');
    if (!grid) return;
    const cards = grid.querySelectorAll('.item-card');
    let hasVisibleCard = false;
    cards.forEach(c => {
      if (c.style.display !== 'none') hasVisibleCard = true;
    });
    sec.style.display = hasVisibleCard ? 'block' : 'none';
  });
}

/* ══════════════════════════════════════
   Drawer Controls (Cart & History)
══════════════════════════════════════ */
function toggleDrawer(type, show) {
  const drawer = document.getElementById(`${type}-drawer`);
  const overlay = document.getElementById(`${type}-overlay`);
  if (!drawer || !overlay) return;
  
  if (show) {
    document.body.style.overflow = 'hidden';
    overlay.style.display = 'block';
    setTimeout(() => {
      drawer.classList.add('open');
    }, 10);
  } else {
    document.body.style.overflow = '';
    drawer.classList.remove('open');
    setTimeout(() => {
      overlay.style.display = 'none';
    }, 300);
  }
}

  const spicyContainer = document.getElementById('spicy-opts');
  if (spicyContainer) {
    spicyContainer.innerHTML = '';

function buildSizeChips(item) {

      const btn = document.createElement('button');
      btn.className = 'opt-chip' + (opt.label === tempOpts.size ? ' active' : '');
      btn.textContent = T.sizes[opt.label] || opt.label;
      btn.onclick = () => {
        tempOpts.size = opt.label;
        tempOpts.currentPrice = opt.price;
        document.querySelectorAll('#size-opts .opt-chip').forEach(b => b.classList.remove('active'));

    sizeGroup.style.display = 'none';
  }
}

function setupOptButtons() {
  document.querySelectorAll('#flavor-opts .opt-chip, #spicy-opts .opt-chip, #cut-opts .opt-chip').forEach(btn => {
    const newBtn = btn.cloneNode(true);
    if (btn.parentNode) {
      btn.parentNode.replaceChild(newBtn, btn);
    }
    
    newBtn.addEventListener('click', function() {
      const type = this.dataset.type, val = this.dataset.val;
      if (type === 'flavor') {
        const idx = tempOpts.flavors.indexOf(val);
        if (idx > -1) { 
          tempOpts.flavors.splice(idx, 1); 
          this.classList.remove('active'); 
        } else { 
          tempOpts.flavors.push(val);      
          this.classList.add('active'); 
        }
      } else if (type === 'spicy') {
        tempOpts.spicy = val;
        document.querySelectorAll('#spicy-opts .opt-chip').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
      } else if (type === 'cut') {
        tempOpts.cut = val;
        document.querySelectorAll('#cut-opts .opt-chip').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
      }
    });
  });
}

/* ══════════════════════════════════════
   Customize Modal Overlay
══════════════════════════════════════ */
function openModal(item) {
  document.body.style.overflow = 'hidden';
  currentItem = item;
  currentQty  = 1;
  const T = t();

  if (item.options) {
    tempOpts.size         = item.options[0].label;
    tempOpts.currentPrice = item.options[0].price;
  } else {
    tempOpts.size         = null;
    tempOpts.currentPrice = item.price;
  }
  tempOpts.flavors = ['胡椒']; // default seasoning to pepper (raw key)
  tempOpts.spicy   = '不辣';
  tempOpts.cut     = '不剪';

  const photoSrc = PHOTOS[item.id] || '';
  const modalThumb = document.getElementById('modal-thumb');
  if (modalThumb) {
    modalThumb.src = photoSrc;
    modalThumb.style.display = photoSrc ? 'block' : 'none';
  }

  const modalName = document.getElementById('modal-name');
  if (modalName) modalName.textContent = lang === 'en' ? (item.nameEn || item.name) : item.name;
  
  const modalPrice = document.getElementById('modal-price');
  if (modalPrice) modalPrice.textContent = `${T.unitPrice} $${tempOpts.currentPrice}`;
  
  const modalQty = document.getElementById('modal-qty');
  if (modalQty) modalQty.textContent = 1;

  buildSizeChips(item);
  buildModalChips(item);

  if (overlay) overlay.style.display = 'flex';
}

function closeModal() {
  document.body.style.overflow = '';
  if (overlay) overlay.style.display = 'none';
}

function changeQty(d) {
  if (currentQty + d >= 1) {
    currentQty += d;
    const modalQty = document.getElementById('modal-qty');
    if (modalQty) modalQty.textContent = currentQty;
  }
}

/* ══════════════════════════════════════
   Confirm Product & Add to Cart
══════════════════════════════════════ */
function confirmAdd() {
  const optRaw = [...tempOpts.flavors];
  if (tempOpts.spicy !== '不辣') optRaw.push(tempOpts.spicy);
  if (currentItem.id === 'fillet' && tempOpts.cut === '要剪') optRaw.push('要剪');

  const cartKey = currentItem.id + (tempOpts.size || '') + optRaw.join(',');
  const ex = cart.find(c => c._key === cartKey);

  if (ex) {
    ex.qty = Math.min(ex.qty + currentQty, 99);
  } else {
    cart.push({
      _key:       cartKey,
      id:         currentItem.id,
      name:       currentItem.name,
      nameEn:     currentItem.nameEn || currentItem.name,
      size:       tempOpts.size,           // raw size key
      price:      tempOpts.currentPrice,
      qty:        Math.min(currentQty, 99),
      optRaw:     optRaw,                  // raw option keys
      photoKey:   currentItem.id,
      isCombo:    currentItem.isCombo,
      comboQty:   currentItem.comboQty,
      comboPrice: currentItem.comboPrice,
    });
  }

  closeModal();
  updateCart();
  initMenu(); // Rebuild menu grid to show updated counts instantly
  showToast(t().toastAdded(itemDisplayName(currentItem, tempOpts.size)));
}

/* ══════════════════════════════════════
   Cart Data Management & Rendering
══════════════════════════════════════ */
function updateCart() {
  const T = t();
  const badge = document.getElementById('float-cart-badge');
  const cartTitleText = document.getElementById('cart-title');
  const preferenceForm = document.getElementById('preference-form');
  const totalItems = cart.reduce((s, c) => s + c.qty, 0);

  if (!cart.length) {
    if (badge) badge.style.display = 'none';
    if (cartTitleText) cartTitleText.textContent = `${T.cartTitle} (0)`;
    if (preferenceForm) preferenceForm.style.display = 'none';
    const lines = T.cartEmpty.split('\n');
    const cartList = document.getElementById('cart-list');
    if (cartList) cartList.innerHTML = `<div class="cart-empty">${lines[0]}<br>${lines[1]}</div>`;
    calcTotal();
    return;
  }

  if (badge) {
    badge.style.display = 'flex';
    badge.textContent = totalItems;
  }
  if (cartTitleText) {
    cartTitleText.textContent = T.cartQty ? T.cartQty(totalItems) : `${T.cartTitle} (${totalItems})`;
  }
  if (preferenceForm) preferenceForm.style.display = 'block';

  // Render cart items
  const cartList = document.getElementById('cart-list');
  if (cartList) {
    cartList.innerHTML = cart.map((c, idx) => {
      const photoSrc = PHOTOS[c.photoKey] || '';
      const displayName = itemDisplayName(c, c.size);
      const optStr = translateOptStr(c.optRaw);

      return `
        <div class="cart-item">
          <img class="ci-thumb" src="${photoSrc}" alt="${displayName}" onerror="this.style.display='none'">
          <div class="ci-info">
            <div class="ci-name">${displayName}</div>
            <div class="ci-opts">${optStr}</div>
          </div>
          <div class="ci-price">$${c.price * c.qty}</div>
          <div class="ci-ctrl">
            <button class="cq-btn minus" onclick="changeCartQty(${idx}, -1)">−</button>
            <span class="cq-qty">${c.qty}</span>
            <button class="cq-btn" onclick="changeCartQty(${idx}, 1)">＋</button>
            <button class="cq-btn del" onclick="removeCartItem(${idx})" aria-label="Delete">
              <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
          </div>
        </div>
      `;
    }).join('');
  }

  calcTotal();
}

function changeCartQty(idx, d) {
  const item = cart[idx];
  if (!item) return;
  if (item.qty + d >= 1) {
    item.qty = Math.min(item.qty + d, 99);
  } else {
    cart.splice(idx, 1);
  }
  updateCart();
  initMenu(); // sync menu card badges
}

function removeCartItem(idx) {
  cart.splice(idx, 1);
  updateCart();
  initMenu();
}

function calcTotal() {
  let subtotal = 0;
  currentDiscounts = [];

  cart.forEach(c => {
    subtotal += c.price * c.qty;
    if (c.isCombo && c.qty >= c.comboQty) {
      const combos = Math.floor(c.qty / c.comboQty);
      const normalPrice = c.price * c.comboQty;
      const discountVal = (normalPrice - c.comboPrice) * combos;
      if (discountVal > 0) {
        currentDiscounts.push({
          id: c.id,
          name: c.name,
          nameEn: c.nameEn,
          nameZh: c.name,
          amount: discountVal
        });
      }
    }
  });

  const totalDiscount = currentDiscounts.reduce((sum, d) => sum + d.amount, 0);
  const grandTotal = Math.max(subtotal - totalDiscount, 0);

  const totalPriceEl = document.getElementById('total-price');
  if (totalPriceEl) totalPriceEl.textContent = grandTotal;

  // Render discounts
  const discRow = document.getElementById('disc-row');
  if (discRow) {
    if (currentDiscounts.length > 0) {
      discRow.style.display = 'flex';
      discRow.innerHTML = currentDiscounts.map(d => {
        const dName = lang === 'en' ? (d.nameEn || d.name) : d.name;
        return `<span class="disc-pill">${t().discLabel(dName, d.amount)}</span>`;
      }).join('');
    } else {
      discRow.style.display = 'none';
      discRow.innerHTML = '';
    }
  }
}

/* ══════════════════════════════════════
   Clear Entire Cart
══════════════════════════════════════ */
function resetCart() {
  if (!cart.length) return;
  if (confirm(t().confirmClear)) { 
    cart = []; 
    updateCart(); 
    initMenu(); // Sync counts in grid
  }
}

/* ══════════════════════════════════════
   Takeout Form Controls
══════════════════════════════════════ */
function setPickupTime(val) {
  currentPickupTime = val;
  const chips = document.querySelectorAll('#pickup-chips .chip-btn');
  chips.forEach(btn => btn.classList.remove('active'));
  
  const activeBtn = Array.from(chips).find(btn => btn.dataset.val === val);
  if (activeBtn) activeBtn.classList.add('active');

  const customTimePicker = document.getElementById('c-time');
  if (customTimePicker) {
    if (val === 'custom') {
      customTimePicker.style.display = 'block';
      if (!customTimePicker.value) {
        const now = new Date();
        now.setMinutes(now.getMinutes() + 15);
        const hours = String(now.getHours()).padStart(2, '0');
        const mins = String(now.getMinutes()).padStart(2, '0');
        customTimePicker.value = `${hours}:${mins}`;
      }
    } else {
      customTimePicker.style.display = 'none';
    }
  }
  saveCustomerInfo();
}

/* ══════════════════════════════════════
   Local Storage & History Cache
══════════════════════════════════════ */
function saveCustomerInfo() {
  const cTime = document.getElementById('c-time');
  const info = {
    pickup: currentPickupTime,
    customTime: cTime ? cTime.value : ''
  };
  localStorage.setItem('fws_customer_info', JSON.stringify(info));
}

function loadCustomerInfo() {
  const saved = localStorage.getItem('fws_customer_info');
  if (!saved) {
    setPickupTime('15');
    return;
  }
  try {
    const info = JSON.parse(saved);
    if (info.pickup) {
      if (info.pickup === 'custom' && info.customTime) {
        setPickupTime('custom');
        const cTime = document.getElementById('c-time');
        if (cTime) cTime.value = info.customTime;
      } else {
        setPickupTime(info.pickup);
      }
    } else {
      setPickupTime('15');
    }
  } catch (e) {
    console.error('Error loading cache', e);
    setPickupTime('15');
  }
}

function saveOrderToHistory(orderText, orderCart, totalPriceVal) {
  let hist = [];
  const rawHist = localStorage.getItem('fws_order_history');
  if (rawHist) {
    try { hist = JSON.parse(rawHist); } catch (e) {}
  }

  // Push new order to front, maximum 5 items
  hist.unshift({
    timestamp: new Date().toISOString(),
    total: totalPriceVal,
    cart: orderCart,
    orderText: orderText
  });
  hist = hist.slice(0, 5);
  localStorage.setItem('fws_order_history', JSON.stringify(hist));
  renderHistory();
}

function renderHistory() {
  const T = t();
  const listEl = document.getElementById('history-list');
  if (!listEl) return;

  let hist = [];
  const rawHist = localStorage.getItem('fws_order_history');
  if (rawHist) {
    try { hist = JSON.parse(rawHist); } catch (e) {}
  }

  if (!hist.length) {
    listEl.innerHTML = `<div class="cart-empty">${T.historyEmpty}</div>`;
    return;
  }

  listEl.innerHTML = hist.map((item, idx) => {
    const formattedDate = new Date(item.timestamp).toLocaleString('zh-TW', {
      month: 'numeric',
      day: 'numeric',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit'
    });

    const summaryText = item.cart.map(c => {
      const sizeLabel = c.size ? `(${T.sizes[c.size] || c.size})` : '';
      const cName = lang === 'en' ? (c.nameEn || c.name) : c.name;
      return `${cName}${sizeLabel} × ${c.qty}`;
    }).join(', ');

    return `
      <div class="history-item">
        <div class="history-head">
          <div class="history-time">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            ${formattedDate}
          </div>
          <div class="history-total">$${item.total}</div>
        </div>
        <div class="history-body-summary">${summaryText}</div>
        <button class="history-reorder-btn" onclick="loadHistoryOrder(${idx})">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          ${T.historyReorder}
        </button>
      </div>`;
  }).join('');
}

function loadHistoryOrder(idx) {
  let hist = [];
  const rawHist = localStorage.getItem('fws_order_history');
  if (rawHist) {
    try { hist = JSON.parse(rawHist); } catch (e) {}
  }
  const item = hist[idx];
  if (!item) return;

  // Overwrite current cart with history items
  cart = JSON.parse(JSON.stringify(item.cart)); // deep clone
  
  updateCart();
  initMenu(); // sync card highlights
  toggleDrawer('history', false);
  toggleDrawer('cart', true);
  showToast(t().historyAdded);
}

/* ══════════════════════════════════════
   Toast Notifications
══════════════════════════════════════ */
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ══════════════════════════════════════
   Send Order Flow via LINE
══════════════════════════════════════ */
async function copyOrder() {
  const T = t();
  if (!cart.length) { 
    showToast(T.toastEmpty); 
    return; 
  }

  // ── 訂單內容文字固定使用中文，方便店家理解 ──
  const ZH = I18N.zh;
  const sep = '─'.repeat(20);
  const lines = [ZH.orderHeader, sep];
  
  // Format pickup time
  let timeStr = '';
  if (currentPickupTime === 'custom') {
    const cTime = document.getElementById('c-time');
    timeStr = cTime ? cTime.value : '';
  } else {
    timeStr = `${currentPickupTime} 分鐘後`;
  }
  lines.push(`🛍️ 取餐時間：自取外帶 (${timeStr})`);

  lines.push(sep);

  // Cart item lists
  cart.forEach(c => {
    const sizePart = c.size ? ` (${ZH.sizes[c.size] || c.size})` : '';
    const dispName = `${c.name}${sizePart}`;
    const optLabel = (c.optRaw && c.optRaw.length)
      ? c.optRaw.map(v => ZH.flavors[v] || ZH.spicy[v] || ZH.cut[v] || v).join(', ')
      : ZH.plain;
    lines.push(`● ${dispName} × ${c.qty}`);
    lines.push(`  └ [${optLabel}]`);
  });

  // Notes
  const notesEl = document.getElementById('c-notes');
  const notesVal = notesEl ? notesEl.value.trim() : '';
  if (notesVal) {
    lines.push(sep);
    lines.push(`📝 備註：${notesVal}`);
  }

  lines.push(sep);
  currentDiscounts.forEach(d => lines.push(ZH.orderDisc(d.nameZh || d.name, d.amount)));
  
  const totalPriceEl = document.getElementById('total-price');
  const grandTotal = totalPriceEl ? totalPriceEl.textContent : '0';
  lines.push(ZH.orderTotal(grandTotal));
  lines.push(ZH.orderTime(new Date().toLocaleTimeString('zh-TW')));

  const text = lines.join('\n');
  lastCompiledOrderText = text;

  // Copy to Clipboard
  try { 
    await navigator.clipboard.writeText(text); 
  } catch {
    const a = document.getElementById('copy-area');
    if (a) {
      a.value = text; 
      a.select(); 
      document.execCommand('copy');
    }
  }

  // Save successful order into customer history
  saveOrderToHistory(text, cart, grandTotal);

  // Open guide modal
  const guideOverlay = document.getElementById('guide-overlay');
  if (guideOverlay) {
    guideOverlay.style.display = 'flex';
  }
}

function closeGuide() {
  const guideOverlay = document.getElementById('guide-overlay');
  if (guideOverlay) {
    guideOverlay.style.display = 'none';
  }
}

function redirectToLine() {
  closeGuide();
  toggleDrawer('cart', false);
  showToast(t().toastLine);
  
  const lineId = '@187ppubm';
  const lineUrl = `https://line.me/R/oaMessage/${lineId}/?${encodeURIComponent(lastCompiledOrderText)}`;
  setTimeout(() => { 
    window.location.href = lineUrl; 
  }, 600);
}

/* ══════════════════════════════════════
   Modal Custom Option Control bindings
══════════════════════════════════════ */
const btnCancel = document.getElementById('btn-cancel');
if (btnCancel) btnCancel.addEventListener('click', closeModal);

const btnConfirm = document.getElementById('btn-confirm');
if (btnConfirm) btnConfirm.addEventListener('click', confirmAdd);

const qtyMinus = document.getElementById('qty-minus');
if (qtyMinus) qtyMinus.addEventListener('click', () => changeQty(-1));

const qtyPlus = document.getElementById('qty-plus');
if (qtyPlus) qtyPlus.addEventListener('click', () => changeQty(1));

if (overlay) {
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
}

/* ══════════════════════════════════════
   Initialization Code
══════════════════════════════════════ */
initTabs();
initMenu();
loadCustomerInfo();
renderHistory();
</script>
